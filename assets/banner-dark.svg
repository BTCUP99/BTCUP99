<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BTCUP99 · Building handy tools">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#151b2b"/></linearGradient>
<radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5b6cff" stop-opacity="0.55"/><stop offset="1" stop-color="#5b6cff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff9a4d" stop-opacity="0.45"/><stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/></radialGradient>
<style>
.title{font:700 64px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f3f5f9;letter-spacing:-1px}
.sub{font:500 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#aeb6c6}
.en{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#6f7a8e}
.chip{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#aeb6c6}
.float{animation:float 6s ease-in-out infinite} .float2{animation:float 7s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 1.2s steps(1) infinite} @keyframes blink{50%{opacity:0}}
</style>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<g class="float"><circle cx="930" cy="120" r="170" fill="url(#g1)"/></g>
<g class="float2"><circle cx="1080" cy="210" r="140" fill="url(#g2)"/></g>
<text x="60" y="112" class="title">BTCUP99</text>
<text x="62" y="156" class="sub">做一些顺手的小工具，把日常的麻烦事交给代码</text>
<text x="62" y="188" class="en">Building small, handy tools for everyday life — desktop, mobile and hardware.</text>
<g transform="translate(60,214)"><rect width="94" height="30" rx="15" fill="#ffffff10" stroke="#ffffff22"/><text x="47.0" y="20" text-anchor="middle" class="chip">Python</text></g><g transform="translate(164,214)"><rect width="82" height="30" rx="15" fill="#ffffff10" stroke="#ffffff22"/><text x="41.0" y="20" text-anchor="middle" class="chip">Rust</text></g><g transform="translate(256,214)"><rect width="90" height="30" rx="15" fill="#ffffff10" stroke="#ffffff22"/><text x="45.0" y="20" text-anchor="middle" class="chip">Kotlin</text></g><g transform="translate(356,214)"><rect width="126" height="30" rx="15" fill="#ffffff10" stroke="#ffffff22"/><text x="63.0" y="20" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(492,214)"><rect width="62" height="30" rx="15" fill="#ffffff10" stroke="#ffffff22"/><text x="31.0" y="20" text-anchor="middle" class="chip">C#</text></g><g transform="translate(564,214)"><rect width="90" height="30" rx="15" fill="#ffffff10" stroke="#ffffff22"/><text x="45.0" y="20" text-anchor="middle" class="chip">ESP32</text></g>
<g transform="translate(860,70)" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
<rect width="290" height="160" rx="14" fill="#0f1420" stroke="#ffffff22"/>
<circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
<text x="22" y="66" fill="#6f7a8e">$</text><text x="40" y="66" fill="#f3f5f9">make it</text>
<text x="22" y="96" fill="#6f7a8e">$</text><text x="40" y="96" fill="#f3f5f9">ship it</text>
<text x="22" y="126" fill="#6f7a8e">$</text><text x="40" y="126" fill="#f3f5f9">open-source it</text><rect x="178" y="111" width="10" height="20" fill="#f3f5f9" class="blink"/>
</g>
</svg>
